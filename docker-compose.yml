services:
  familyfeud:
    build:
      context: .
      dockerfile: Dockerfile
    image: familyfeud:latest
    container_name: familyfeud
    ports:
      - "${PORT:-80}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
